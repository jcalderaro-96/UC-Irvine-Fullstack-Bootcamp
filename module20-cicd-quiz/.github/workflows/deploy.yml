name: Deploy to Render  # Workflow name

on:
  push:
    branches:
      - main  # Trigger on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Get the repo code

      - name: Setup Node.js
        uses: actions/setup-node@v3  # Set Node.js version
        with:
          node-version: 16  # Use Node.js 16

      - name: Install dependencies
        run: npm install  # Install project packages

      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"  # Use secret for deploy hook URL
